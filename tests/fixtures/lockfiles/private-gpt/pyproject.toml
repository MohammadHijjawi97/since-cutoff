[project]
name = "private-gpt"
version = "1.0.1"
description = "Private GPT"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework
    "fastapi[all]>=0.136.0",
    "python-multipart>=0.0.26",
    # DI + config
    "injector>=0.24.0,<0.25",
    "pyyaml>=6.0.3,<7",
    # Utilities
    "cachetools>=7.0.0",
    "partial-json-parser>=0.2.1.1.post7,<0.3",
    "requests>=2.33.0,<3",
    "arq>=0.26,<0.27",
]

[project.scripts]
private-gpt = "private_gpt.cli.main:main"

[project.optional-dependencies]

# ---------------------------------------------------------------------------
# LLM providers
# ---------------------------------------------------------------------------
# sdk-openai: shared base for llm-openai* and embedding-openai*
sdk-openai = [
    "openai>=2.0.0,<3",
]
llm-mistral = [
    "huggingface_hub",
]
llm-anthropic = [
    "anthropic>=0.122.0",
]

# ---------------------------------------------------------------------------
# Tokenizers
# ---------------------------------------------------------------------------
tokenizer-local = [
    "transformers>=5.7.0",
    "huggingface-hub",
]
tokenizer = [
    "private-gpt[tokenizer-local]",
]

# ---------------------------------------------------------------------------
# Database providers
# ---------------------------------------------------------------------------
# database-core: shared base for all database-* extras
database-core = [
    "sqlalchemy>=2.0.49,<3",
    "sqlgpt-parser>=0.0.1a5",
]
database-db2 = [
    "private-gpt[database-core]",
    "ibm-db>=3.2.9; platform_machine != 'aarch64'",
    "ibm-db-sa>=0.4.4; platform_machine != 'aarch64'",
]

# ---------------------------------------------------------------------------
# Queue / Task processing
# ---------------------------------------------------------------------------
queue-celery = [
    "celery==5.4.0,<6",
    "flower>=2.0.1,<3",
]

# ---------------------------------------------------------------------------
# Tool integrations
# ---------------------------------------------------------------------------
tool-mcp = [
    "mcp>=2.0.0,<3",
]
tool-web-scraping = [
    "playwright==1.60.0",
]

# ---------------------------------------------------------------------------
# Media processing
# ---------------------------------------------------------------------------
# media-core: shared torch base for all media-* extras
media-core = [
    "torch>=2.11.0,<3",
]

# ---------------------------------------------------------------------------
# Dev tooling
# ---------------------------------------------------------------------------
lint = [
    "ruff>=0,<1",
]
test = [
    "pytest>=9,<10",
]
typecheck = [
    "types-pyyaml>=6.0.12.12,<7",
    "ty==0.0.59",
]
dev = [
    "private-gpt[lint,test,typecheck]",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
