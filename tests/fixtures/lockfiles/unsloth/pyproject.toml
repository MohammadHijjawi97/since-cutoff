[build-system]
requires = ["setuptools==82.0.1", "setuptools-scm==9.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth"
dynamic = ["version"]
requires-python = ">=3.9,<3.15"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12.0",
    "rich",
    "pydantic",
    "pyyaml",
    "nest-asyncio",
    "huggingface-hub>=0.34.0",
    # Every CLI command imports studio.backend.*, which reaches structlog at
    # module level. The rest of the server stack lives in the studio extra.
    "structlog>=24.1.0",
    # unsloth_cli/__init__.py reaches click via commands/start.py, so every
    # command needs it. typer supplied it until 0.27 dropped the dependency.
    "click>=8.0",
]

[project.scripts]
unsloth = "unsloth_cli:app"

[project.optional-dependencies]
# Unsloth's server stack, mirroring studio/backend/requirements/studio.txt.
# test_studio_extra_matches_requirements.py catches drift.
studio = [
    "typer==0.27.1 ; python_version >= '3.10'",
    "typer==0.23.2 ; python_version < '3.10'",
    "fastapi==0.141.1 ; python_version >= '3.10'",
    "fastapi==0.128.8 ; python_version < '3.10'",
    "pydantic==2.13.4",
    "packaging==26.3",
    # win_arm64 pandas wheels start at 3.0; the 3.11 floor is pandas 3's own requires-python.
    "pandas==2.3.3 ; sys_platform != 'win32' or platform_machine != 'ARM64' or python_version < '3.11'",
    "pandas>=3.0,<4 ; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version >= '3.11'",
    "nest_asyncio==1.6.0",
    "datasets==4.3.0",
    "huggingface-hub>=1.31.0,<2.0 ; python_version >= '3.10'",
    "huggingface-hub==0.36.2 ; python_version < '3.10'",
    "hf-xet>=1.5.2,<2.0 ; python_version >= '3.10' and (platform_machine == 'x86_64' or platform_machine == 'amd64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64')",
    "cryptography>=42.0.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Windows on ARM: 46.0.7 publishes no win_arm64 wheel and the sdist needs Rust.
    "cryptography>=42.0.0,<=46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
    # No win_arm64 wheel and no sdist either, so it cannot be floored or built. Dropped rather
    # than pinned: the RAG store already treats a missing sqlite_vec as "RAG unavailable".
    "sqlite-vec==0.1.9 ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Mirrors studio.txt: pymupdf publishes a win_arm64 wheel from 1.28 only.
    "pymupdf==1.27.2.3 ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pymupdf>=1.28.2 ; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "pymupdf4llm==0.3.4",
]

triton = [
    # Not raised past 3.0.0 on purpose. torch pins triton exactly, and the oldest
    # torch supported here, 2.6.0, requires `triton==3.2.0`, so any floor above
    # that makes torch 2.6.0 unresolvable rather than safe, and a marker cannot
    # be written against another distribution's version. The two triton defects
    # that were reported through us are handled where the version is actually
    # known: the sm_75 cut cross entropy miscompile in triton 3.3.0 and 3.3.1
    # (#2491) by the gate in unsloth_zoo/loss_utils.py, and the missing
    # PY_SSIZE_T_CLEAN in a repackaged driver shim (#2760) by
    # check_triton_py_ssize_t_clean() in unsloth/import_fixes.py.
    "triton>=3.0.0 ; ('linux' in sys_platform)",
    # triton-windows has win_arm64 wheels from 3.8.0.post28, so a floor works here, not a marker.
    "triton-windows ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "triton-windows>=3.8.0.post28 ; (sys_platform == 'win32') and platform_machine == 'ARM64'",
]

huggingfacenotorch = [
    "unsloth_zoo>=2026.9.7",
    "packaging",
    "numpy",
    "datasets>=3.4.1,!=4.0.*,!=4.1.0,<4.4.0",
    "huggingface_hub>=0.34.0",
    # A Rust extension with no win_arm64 wheel. huggingface_hub imports it only under
    # HF_HUB_ENABLE_HF_TRANSFER=1, and hf_xet ships win_arm64 and covers fast downloads.
    "hf_transfer ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "diffusers>=0.39.0 ; python_version >= '3.10'",
    "diffusers ; python_version < '3.10'",
    "transformers>=4.51.3,!=4.52.0,!=4.52.1,!=4.52.2,!=4.52.3,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.0,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.5.0",
    "trl>=0.18.2,!=0.19.0,<=0.24.0",
]
# torchcodec backend for Gemma audio / datasets>=4 (#7225).
audio-torch211 = [
    "torchcodec>=0.11.0,<0.12.0 ; python_version >= '3.10' and python_version < '3.15' and (((sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    "soundfile>=0.12.1 ; python_version >= '3.10' and python_version < '3.15' and (((sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
]
audio-torch280 = [
    "torchcodec>=0.6.0,<0.8.0 ; python_version >= '3.9' and python_version < '3.14' and (((sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    "soundfile>=0.12.1 ; python_version >= '3.9' and python_version < '3.14' and (((sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')) or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
]
huggingface = [
    "unsloth[huggingfacenotorch]",
    "unsloth_zoo>=2026.9.7",
    "torchvision",
    "unsloth[triton]",
]
windows = [
    "unsloth[huggingface]",
    # bitsandbytes ships a win_arm64 wheel from 0.50.0, so this row covers it.
    "bitsandbytes>=0.45.5,!=0.46.0,!=0.48.0 ; (sys_platform == 'win32')",
    # No win_arm64 wheel and no sdist that builds without CUDA's Windows-ARM toolchain, so this
    # row would fail the whole extra. Torch's SDPA is the fallback.
    "xformers>=0.0.22.post7 ; (sys_platform == 'win32') and platform_machine != 'ARM64'",
]

cu118only = [
    "xformers @ https://download.pytorch.org/whl/cu118/xformers-0.0.22.post7%2Bcu118-cp39-cp39-manylinux2014_x86_64.whl ; python_version=='3.9' and ('linux' in sys_platform)",
    "xformers @ https://download.pytorch.org/whl/cu118/xformers-0.0.22.post7%2Bcu118-cp310-cp310-manylinux2014_x86_64.whl ; python_version=='3.10' and ('linux' in sys_platform)",
]
cu126onlytorch2100 = [
    # Pin torch so ARM64 (x86-64-only xformers wheel skipped) stays on 2.10.
    "torch==2.10.0",
    "xformers @ https://download.pytorch.org/whl/cu126/xformers-0.0.34-cp39-abi3-manylinux_2_28_x86_64.whl ; ('linux' in sys_platform) and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "xformers @ https://download.pytorch.org/whl/cu126/xformers-0.0.34-cp39-abi3-win_amd64.whl ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
cu126onlytorch2121 = [
    # torchvision exact-pins torch, so the 2.12.1 patch takes 0.27.1.
    "torch==2.12.1+cu126",
    "torchvision==0.27.1+cu126",
    "torchaudio==2.11.0+cu126",
    "xformers @ https://download.pytorch.org/whl/cu126/xformers-0.0.35-py39-none-manylinux_2_28_x86_64.whl ; ('linux' in sys_platform) and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "xformers @ https://download.pytorch.org/whl/cu126/xformers-0.0.35-py39-none-win_amd64.whl ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
cu130onlytorch2121 = [
    "torch==2.12.1+cu130",
    "torchvision==0.27.1+cu130",
    "torchaudio==2.11.0+cu130",
    "xformers @ https://download.pytorch.org/whl/cu130/xformers-0.0.35-py39-none-manylinux_2_28_x86_64.whl ; ('linux' in sys_platform) and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "xformers @ https://download.pytorch.org/whl/cu130/xformers-0.0.35-py39-none-win_amd64.whl ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
cu118-torch211 = [
    "unsloth[huggingface]",
    "bitsandbytes==0.45.5",
    "unsloth[cu118onlytorch211]",
]
flashattention = [
    "packaging ; ('linux' in sys_platform)",
    "ninja ; ('linux' in sys_platform)",
    "flash-attn>=2.6.3 ; ('linux' in sys_platform)",
]
intelgputorch260 = [
    "unsloth_zoo[intelgpu]",
    "pytorch_triton_xpu @ https://download.pytorch.org/whl/pytorch_triton_xpu-3.2.0-cp312-cp312-linux_x86_64.whl#sha256=bd340903d03470708df3442438acb8b7e08087ab9e61fbe349b2872bf9257ab0 ; ('linux' in sys_platform) and python_version == '3.12' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "pytorch_triton_xpu @ https://download.pytorch.org/whl/pytorch_triton_xpu-3.2.0-cp313-cp313-linux_x86_64.whl#sha256=814dccc8a07159e6eca74bed70091bc8fea2d9dd87b0d91845f9f38cde62f01c ; ('linux' in sys_platform) and python_version == '3.13' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "bitsandbytes @ https://github.com/bitsandbytes-foundation/bitsandbytes/releases/download/continuous-release_main/bitsandbytes-1.33.7.preview-py3-none-win_amd64.whl ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "torch @ https://download.pytorch.org/whl/xpu/torch-2.6.0%2Bxpu-cp312-cp312-linux_x86_64.whl#sha256=c4c5c67625cdacf35765c2b94e61fe166e3c3f4a14521b1212a59ad1b3eb0f2e ; ('linux' in sys_platform) and python_version == '3.12' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "torch @ https://download.pytorch.org/whl/xpu/torch-2.6.0%2Bxpu-cp313-cp313-linux_x86_64.whl#sha256=e6864f7a60a5ecc43d5d38f59a16e5dd132384f73dfd3a697f74944026038f7b ; ('linux' in sys_platform) and python_version == '3.13' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
