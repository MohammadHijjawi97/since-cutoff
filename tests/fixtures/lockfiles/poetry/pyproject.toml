[project]
name = "poetry"
version = "2.5.1"
description = "Python dependency management and packaging made easy."
requires-python = ">=3.10,<4.0"
dependencies = [
    "poetry-core (==2.5.0)",
    "build (>=1.2.1,<2.0.0)",
    "cachecontrol[filecache] (>=0.14.0,<0.15.0)",
    "cleo (>=2.1.0,<3.0.0)",
    "dulwich (>=0.25.0,<2)",
    "keyring (>=25.1.0,<26.0.0)",
    # packaging uses calver, so version is unclamped
    "packaging (>=24.2)",  # PEP 639 support was added in 24.2
    "platformdirs (>=3.0.0,<5)",
    "requests (>=2.26,<3.0)",
    "tomli (>=2.0.1,<3.0.0) ; python_version < '3.11'",
    # trove-classifiers uses calver, so version is unclamped
    "trove-classifiers (>=2022.5.19)",
    "virtualenv (>=20.26.6)",
    "xattr (>=1.0.0,<2.0.0) ; sys_platform == 'darwin'",
    "findpython (>=0.6.2,<0.9.0)",
    # pbs-installer uses calver, so version is unclamped
    "pbs-installer[download,install] (>=2025.6.10)",
]
license = "MIT"
readme = "README.md"
# classifiers are dynamic because we want to create Python classifiers automatically
dynamic = [ "classifiers" ]

[project.scripts]
poetry = "poetry.console.application:main"


[tool.poetry]
requires-poetry = ">=2.0"
include = [{ path = "tests", format = "sdist" }]

[tool.poetry.group.dev.dependencies]
pre-commit = ">=2.10"

[tool.poetry.group.test.dependencies]
# test_clone_with_lfs_files relies on being able to use
# locally cloned LFS stores, which requires dulwich>=1.2.1
dulwich = ">=1.2.1"
pytest = ">=9.0"
pytest-xdist = { version = ">=3.1", extras = ["psutil"] }

[tool.poetry.group.typing.dependencies]
mypy = ">=1.8.0"
types-requests = ">=2.28.8"

# only used in github actions
[tool.poetry.group.github-actions]
optional = true
[tool.poetry.group.github-actions.dependencies]
pytest-github-actions-annotate-failures = "^0.1.7"


[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
