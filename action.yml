name: since-cutoff
description: List the API changes in your pinned Python dependencies since your coding model's training cutoff. No API key needed.
author: Mohammad Hijjawi

branding:
  icon: clock
  color: orange

inputs:
  model:
    description: >-
      The coding model, as provider:model, for example anthropic:claude-sonnet-4-5,
      openai:gpt-5.4 or claude-code:sonnet. Only its training cutoff is used: no model is called
      and no API key is needed.
    required: true
  working-directory:
    description: The project directory (with a lockfile, requirements*.txt or pyproject.toml).
    required: false
    default: "."
  only:
    description: Only check these dependencies (comma-separated PyPI names).
    required: false
    default: ""
  exclude:
    description: Skip these dependencies (comma-separated PyPI names).
    required: false
    default: ""
  cutoff:
    description: Override the model's training cutoff (YYYY-MM or YYYY-MM-DD).
    required: false
    default: ""
  cutoff-margin:
    description: >-
      Compare from the latest release published this many days before the cutoff (the
      since-cutoff default is 30; 0 compares from the latest release at the cutoff itself).
    required: false
    default: ""
  fail-on-changes:
    description: Fail the step when any dependency changed its API after the cutoff.
    required: false
    default: "false"
  check-notes:
    description: >-
      Also run `since-cutoff sync --check`, and fail the job when the since-cutoff notes in
      AGENTS.md / CLAUDE.md are out of date for the lockfile and the code (exit code 3), or
      the block was edited by hand (exit code 4). It writes nothing. The notes keep the model
      they were written for; `model` is used when there are none yet.
    required: false
    default: "false"
  step-summary:
    description: Add the Markdown summary to the job summary.
    required: false
    default: "true"
  pr-comment:
    description: >-
      On pull_request events, post the Markdown summary as one comment on the pull request (one
      per working-directory), and edit that comment on later runs. The job needs
      `permissions: pull-requests: write`. For a pull request from a fork (whose token cannot
      write on pull_request, and which pull_request_target should not let write), the step
      prints a notice instead.
    required: false
    default: "false"
  cache:
    description: >-
      Cache PyPI metadata, package sources and API diffs between runs (saved also when
      fail-on-changes fails the job).
    required: false
    default: "true"
  args:
    description: Extra arguments for `since-cutoff scan`, for example "--all-deps --limit 20".
    required: false
    default: ""
  since-cutoff-version:
    description: >-
      The since-cutoff release to run: a version on PyPI, "latest", or "local" to build the
      action's own source (this repository's CI tests its checkout that way).
    required: false
    default: "0.5.0"

outputs:
  changed-packages:
    description: Comma-separated names of the dependencies whose API changed after the cutoff.
    value: ${{ steps.scan.outputs.changed-packages }}
  changes:
    description: >-
      Number of breaking API changes found by the static diff (a change reachable under
      several import paths counts once).
    value: ${{ steps.scan.outputs.changes }}
  deprecations:
    description: Number of new deprecations.
    value: ${{ steps.scan.outputs.deprecations }}
  markdown:
    description: Path to the Markdown summary, for example to post as a pull request comment.
    value: ${{ steps.scan.outputs.markdown }}
  report:
    description: Path to the full Markdown report (results.json is in the same directory).
    value: ${{ steps.scan.outputs.report }}
  notes:
    description: >-
      With check-notes: up-to-date, out-of-date, edited-by-hand or error (empty without
      check-notes).
    value: ${{ steps.scan.outputs.notes }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: "false"

    # Restore and save are separate steps (not actions/cache, which saves only when the job
    # succeeds), so that a run with fail-on-changes still keeps what it downloaded.
    - name: Restore the since-cutoff cache
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/since-cutoff-cache
        key: since-cutoff-${{ runner.os }}-${{ inputs.since-cutoff-version }}-${{ hashFiles('**/uv.lock', '**/poetry.lock', '**/pdm.lock', '**/pylock*.toml', '**/Pipfile.lock', '**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          since-cutoff-${{ runner.os }}-${{ inputs.since-cutoff-version }}-
          since-cutoff-${{ runner.os }}-

    - name: Scan the dependencies
      id: scan
      shell: bash
      env:
        SC_MODEL: ${{ inputs.model }}
        SC_WORKDIR: ${{ inputs.working-directory }}
        SC_ONLY: ${{ inputs.only }}
        SC_EXCLUDE: ${{ inputs.exclude }}
        SC_CUTOFF: ${{ inputs.cutoff }}
        SC_CUTOFF_MARGIN: ${{ inputs.cutoff-margin }}
        SC_FAIL: ${{ inputs.fail-on-changes }}
        SC_CHECK_NOTES: ${{ inputs.check-notes }}
        SC_STEP_SUMMARY: ${{ inputs.step-summary }}
        SC_ARGS: ${{ inputs.args }}
        SC_VERSION: ${{ inputs.since-cutoff-version }}
        SC_ACTION_PATH: ${{ github.action_path }}
        SINCE_CUTOFF_CACHE: ${{ runner.temp }}/since-cutoff-cache
        COLUMNS: "160"
      run: |
        set -uo pipefail
        out="$(mktemp -d "$RUNNER_TEMP/since-cutoff.XXXXXX")"
        summary="$out/summary.md"
        case "$SC_VERSION" in
          local)
            # A fresh wheel of the action's source; uv could reuse an older build of a directory.
            uv build --quiet --wheel --out-dir "$out/dist" "$SC_ACTION_PATH" || exit 1
            wheels=("$out"/dist/*.whl)
            from=(--from "${wheels[0]}")
            ;;
          latest) from=(--from "since-cutoff@latest") ;;
          *) from=(--from "since-cutoff==$SC_VERSION") ;;
        esac

        args=(scan "$SC_WORKDIR" --model "$SC_MODEL" --out "$out" --markdown "$summary")
        if [ -n "$SC_ONLY" ]; then args+=(--only "$SC_ONLY"); fi
        if [ -n "$SC_EXCLUDE" ]; then args+=(--exclude "$SC_EXCLUDE"); fi
        if [ -n "$SC_CUTOFF" ]; then args+=(--cutoff "$SC_CUTOFF"); fi
        if [ -n "$SC_CUTOFF_MARGIN" ]; then args+=(--cutoff-margin "$SC_CUTOFF_MARGIN"); fi
        if [ "$SC_FAIL" = "true" ]; then args+=(--fail-on-changes); fi
        if [ -n "$SC_ARGS" ]; then read -ra extra <<< "$SC_ARGS"; args+=("${extra[@]}"); fi

        status=0
        uvx "${from[@]}" since-cutoff "${args[@]}" || status=$?
        # This step succeeds so that the cache is saved; "Report the result" fails the job.
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

        if [ -f "$out/results.json" ]; then
          outputs="$(uvx "${from[@]}" python - "$out/results.json" <<'PY'
        import json
        import sys

        sys.stdout.reconfigure(newline="\n")  # no CRLF on Windows runners
        with open(sys.argv[1], encoding="utf-8") as fh:
            result = json.load(fh)
        changed = [p["package"] for p in result["packages"] if p["status"] == "changed"]
        print("changed-packages=" + ",".join(changed))
        print(f"changes={result['breaking_changes']}")
        print(f"deprecations={result['deprecations']}")
        PY
          )"
          echo "$outputs" >> "$GITHUB_OUTPUT"
          echo "report=$out/report.md" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$summary" ]; then
          echo "markdown=$summary" >> "$GITHUB_OUTPUT"
          if [ "$SC_STEP_SUMMARY" = "true" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
        fi

        # The notes: sync --check writes nothing. A block keeps its model and cutoff; the model
        # input is for a project with no block yet (sync reads it from SINCE_CUTOFF_MODEL), and
        # so is the cutoff input, as for the scan above. The margin is the scan's setting, not
        # the block's, so it applies always. only and exclude do not apply: the notes are for
        # the whole project.
        notes_status=0
        if [ "$SC_CHECK_NOTES" = "true" ]; then
          notes_args=(sync "$SC_WORKDIR" --check)
          if [ -n "$SC_CUTOFF" ] && ! grep -qs -- '<!-- since-cutoff:start -->' "$SC_WORKDIR/AGENTS.md" "$SC_WORKDIR/CLAUDE.md"; then
            notes_args+=(--model "$SC_MODEL" --cutoff "$SC_CUTOFF")
          fi
          if [ -n "$SC_CUTOFF_MARGIN" ]; then notes_args+=(--cutoff-margin "$SC_CUTOFF_MARGIN"); fi
          SINCE_CUTOFF_MODEL="$SC_MODEL" uvx "${from[@]}" since-cutoff "${notes_args[@]}" || notes_status=$?
          case "$notes_status" in
            0) notes=up-to-date ;;
            3) notes=out-of-date ;;
            4) notes=edited-by-hand ;;
            *) notes=error ;;
          esac
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
        fi
        echo "notes-exit-code=$notes_status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Save the since-cutoff cache
      if: inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/since-cutoff-cache
        key: ${{ steps.cache.outputs.cache-primary-key }}

    # One comment per pull request and working-directory, found again by its marker and edited
    # on each run. Before "Report the result", so that a failing scan still updates it.
    - name: Comment on the pull request
      if: ${{ !cancelled() && inputs.pr-comment == 'true' && steps.scan.outputs.exit-code != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_ENTERPRISE_TOKEN: ${{ github.token }}
        SC_MARKDOWN: ${{ steps.scan.outputs.markdown }}
        SC_STEP_SUMMARY: ${{ inputs.step-summary }}
        SC_WORKDIR: ${{ inputs.working-directory }}
        SC_PR: ${{ github.event.pull_request.number }}
        SC_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        # The marker names the working-directory, so that two steps (or a matrix) scanning two
        # projects keep a comment each; the project root's has no directory.
        backslash='\'
        dir="${SC_WORKDIR//"$backslash"//}"
        while [ "${dir#./}" != "$dir" ]; do dir="${dir#./}"; done
        while [ "${dir%/}" != "$dir" ]; do dir="${dir%/}"; done
        dir="${dir//>/}"
        case "$dir" in
          "" | .) marker='<!-- since-cutoff:pr-comment -->' where="the project root" ;;
          *) marker="<!-- since-cutoff:pr-comment:$dir -->" where="$dir" ;;
        esac
        if [ -z "$SC_PR" ]; then
          echo "::notice title=since-cutoff::pr-comment: not a pull request ($GITHUB_EVENT_NAME), so no comment"
          exit 0
        fi
        # A fork's token cannot write on pull_request; on pull_request_target it can, but then a
        # fork's change would choose what is written with it. An unknown head (a deleted fork)
        # counts as a fork.
        if [ "$SC_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::notice title=since-cutoff::pr-comment: the token of a pull request from a fork cannot comment, so the summary is in the job summary only"
          else
            echo "::notice title=since-cutoff::pr-comment: the pull request is from a fork, so $GITHUB_EVENT_NAME posts no comment and the summary is in the job summary only"
          fi
          exit 0
        fi
        if ! command -v gh > /dev/null; then
          echo "::warning title=since-cutoff::pr-comment: gh not found (the GitHub CLI, which GitHub-hosted runners have), so no comment"
          exit 0
        fi
        # On GitHub Enterprise Server, gh talks to the server the workflow runs on.
        host="${GITHUB_SERVER_URL#*://}"
        export GH_HOST="${GH_HOST:-${host%%/*}}"

        # GitHub takes up to 65,536 characters; a byte is at most one character (LC_ALL=C makes
        # awk count bytes, not characters). A longer summary is cut after a whole line, then a
        # code fence left open is closed, then each open <details>.
        max="${SINCE_CUTOFF_COMMENT_MAX_BYTES:-64000}"
        run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        body="$(mktemp "${RUNNER_TEMP:-/tmp}/since-cutoff-comment.XXXXXX")"
        {
          printf '%s\n' "$marker"
          if [ -n "$SC_MARKDOWN" ] && [ -f "$SC_MARKDOWN" ]; then
            if [ "$(( $(wc -c < "$SC_MARKDOWN") ))" -le "$max" ]; then
              cat "$SC_MARKDOWN"
            else
              LC_ALL=C awk -v max="$max" '
                { size += length($0) + 1; if (size > max) exit; print }
                fence != "" {
                  if ($0 ~ ("^ *" fence "[" substr(fence, 1, 1) "]* *$")) fence = ""
                  next
                }
                match($0, /^ *(```+|~~~+)/) { fence = substr($0, RSTART, RLENGTH); sub(/^ +/, "", fence); next }
                { opened += gsub(/<details/, "&"); closed += gsub(/<\/details>/, "&") }
                END { if (fence != "") print fence; for (i = closed; i < opened; i++) print "</details>" }
              ' "$SC_MARKDOWN"
              if [ "$SC_STEP_SUMMARY" = "true" ]; then
                printf '\n**The summary is longer than a comment can be, so it was cut here: the [job summary](%s) has all of it.**\n' "$run_url"
              else
                printf '\n**The summary is longer than a comment can be, so it was cut here** (`step-summary: true` adds all of it to the [job summary](%s)).\n' "$run_url"
              fi
            fi
          else
            printf '## since-cutoff scan\n\nThe scan did not finish, so there is no summary for this commit: see the [workflow run](%s).\n' "$run_url"
          fi
          printf '\n<sub>Updated for %s by the since-cutoff action ([workflow run](%s)).</sub>\n' "${SC_HEAD_SHA:0:7}" "$run_url"
        } > "$body"

        comments="repos/$GITHUB_REPOSITORY/issues/$SC_PR/comments"
        err="$(mktemp "${RUNNER_TEMP:-/tmp}/since-cutoff-gh.XXXXXX")"
        # Each comment as "id author first-line": ours start with the marker line.
        if ! listed="$(gh api --paginate "$comments" --jq '.[] | "\(.id) \(.user.login) \((.body // "") | split("\n") | .[0])"' 2> "$err")"; then
          echo "::warning title=since-cutoff::pr-comment: could not read the comments of pull request #$SC_PR on $GH_HOST ($(head -n 1 "$err")); the job needs permissions: pull-requests: write"
          exit 0
        fi
        id="" found=0
        while read -r cid author first; do
          if [ "$author" = "github-actions[bot]" ] && [ "${first%$'\r'}" = "$marker" ]; then
            found=$((found + 1))
            if [ -z "$id" ] || [ "$cid" -gt "$id" ]; then id="$cid"; fi
          fi
        done <<< "$listed"
        if [ "$found" -gt 1 ]; then
          echo "::notice title=since-cutoff::pr-comment: pull request #$SC_PR has $found since-cutoff comments for $where; the newest ($id) is edited, the others are left as they are"
        fi
        if [ -n "$id" ]; then
          request=(--method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id")
        else
          request=(--method POST "$comments")
        fi
        # This repository's CI checks the comment without posting it.
        if [ -n "${SINCE_CUTOFF_COMMENT_DRY_RUN:-}" ]; then
          { echo "gh api ${request[*]} -F body=@-"; echo; cat "$body"; } > "$SINCE_CUTOFF_COMMENT_DRY_RUN"
          echo "Dry run: gh api ${request[*]} -F body=@$body"
          exit 0
        fi
        if ! gh api "${request[@]}" -F "body=@$body" --jq '"pr-comment: " + .html_url' 2> "$err"; then
          echo "::warning title=since-cutoff::pr-comment: could not write the comment on pull request #$SC_PR on $GH_HOST ($(head -n 1 "$err")); the job needs permissions: pull-requests: write"
        fi
        exit 0

    - name: Report the result
      if: ${{ !cancelled() && steps.scan.outputs.exit-code != '' && (steps.scan.outputs.exit-code != '0' || steps.scan.outputs.notes-exit-code != '0') }}
      shell: bash
      env:
        SC_STATUS: ${{ steps.scan.outputs.exit-code }}
        SC_NOTES_STATUS: ${{ steps.scan.outputs.notes-exit-code }}
        SC_MODEL: ${{ inputs.model }}
        SC_CHANGED: ${{ steps.scan.outputs.changed-packages }}
      run: |
        if [ "$SC_STATUS" = "3" ]; then
          echo "::error title=since-cutoff::API changes since the training cutoff of $SC_MODEL in: ${SC_CHANGED//,/, }"
        fi
        if [ "$SC_NOTES_STATUS" = "3" ]; then
          echo "::error title=since-cutoff::The since-cutoff notes in AGENTS.md / CLAUDE.md are out of date: run since-cutoff sync and commit the file"
        elif [ "$SC_NOTES_STATUS" = "4" ]; then
          echo "::error title=since-cutoff::The since-cutoff notes block was edited by hand: move your text below it, or run since-cutoff sync --force"
        fi
        if [ "$SC_STATUS" != "0" ]; then
          exit "$SC_STATUS"
        fi
        exit "${SC_NOTES_STATUS:-0}"
