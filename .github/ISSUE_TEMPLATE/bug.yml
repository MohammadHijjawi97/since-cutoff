name: Bug report
description: Something crashed or behaved unexpectedly
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "since-cutoff run --quick --model claude-code"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the output (and `since-cutoff --version`, your OS and Python version).
    validations:
      required: true
