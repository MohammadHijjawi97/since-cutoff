name: Bug report
description: Something crashed or behaved unexpectedly
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "since-cutoff run --quick --model claude-code"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the output (with version, OS and Python). First review https://github.com/MohammadHijjawi97/since-cutoff/blob/main/docs/troubleshooting.md.
    validations:
      required: true
