name: Materialize issue 47

on:
  push:
    branches:
      - feat/mcp-prompts-47

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'chore: materialize validated issue 47'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated transformation
        run: python .bursia/apply_issue_47.py
      - name: Remove temporary materializer
        run: rm -rf .bursia .github/workflows/materialize-47.yml
      - name: Commit final issue diff
        run: |
          git config user.name "soyeladice-svg"
          git config user.email "soyeladice@gmail.com"
          git add -A
          git commit -m "feat: implement issue #47"
          git push
