name: Scorecard supply-chain security

# OpenSSF Scorecard (https://scorecard.dev): checks this repository's supply-chain practices,
# publishes the result to the OpenSSF API (for the badge and https://scorecard.dev/viewer) and
# uploads it to code scanning. From the official template (actions/starter-workflows,
# code-scanning/scorecard.yml). With publish_results the Scorecard API rejects results unless:
# no workflow-level env, defaults or write permissions; in the analysis job no env, defaults,
# containers, services or `run` steps, only the actions below, and an Ubuntu runner.

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # So that the Maintained check is updated at least weekly.
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish the results and get a badge (see publish_results below).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the results to the OpenSSF REST API: public repositories only; it enables
          # the Scorecard badge (https://github.com/ossf/scorecard-action#publishing-results).
          publish_results: true

      # The SARIF file in the run's artifacts, for five days (for debugging a run).
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # The results in the repository's code-scanning dashboard (Security tab).
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
