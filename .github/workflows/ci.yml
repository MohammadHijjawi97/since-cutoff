name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . ruff mypy
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest pytest-cov
      - run: python -m pytest -m "not network" --cov=since_cutoff --cov-report=term-missing

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -m network
      - name: Smoke test against real PyPI (no model calls)
        run: |
          mkdir -p /tmp/demo && cd /tmp/demo
          printf 'anthropic==1.8.0\nhuggingface-hub==2.0.0\n' > requirements.txt
          since-cutoff scan --cutoff 2025-07-31 --limit 3
          test -f .since-cutoff/results.json

  action:
    # The GitHub Action (action.yml) from this checkout, against the example project. Like the
    # network job it talks to PyPI and models.dev; it never calls a model.
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Scan examples/agent-app
        id: scan
        uses: ./
        with:
          model: anthropic:claude-haiku-4-5
          working-directory: examples/agent-app
          since-cutoff-version: local
      - name: Scan again with fail-on-changes (must fail)
        id: strict
        continue-on-error: true
        uses: ./
        with:
          model: anthropic:claude-haiku-4-5
          working-directory: examples/agent-app
          only: huggingface-hub
          fail-on-changes: "true"
          step-summary: "false"
          since-cutoff-version: local
      - name: Check the outputs
        shell: bash
        env:
          CHANGED: ${{ steps.scan.outputs.changed-packages }}
          CHANGES: ${{ steps.scan.outputs.changes }}
          MARKDOWN: ${{ steps.scan.outputs.markdown }}
          REPORT: ${{ steps.scan.outputs.report }}
          STRICT: ${{ steps.strict.outcome }}
        run: |
          set -euxo pipefail
          [[ ",$CHANGED," == *",huggingface-hub,"* ]]
          [ "$CHANGES" -gt 0 ]
          grep -q "<b>huggingface-hub</b>" "$MARKDOWN"
          test -f "$REPORT"
          [ "$STRICT" = "failure" ]

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
