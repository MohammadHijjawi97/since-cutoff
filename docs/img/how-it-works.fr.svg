<svg xmlns="http://www.w3.org/2000/svg" width="640" height="508" viewBox="0 0 640 508" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Fonctionnement de since-cutoff</title>
<desc id="desc">Analyse, sans appel au modèle : le fichier de verrouillage donne vos versions exactes, since-cutoff trouve la version de chaque dépendance à la date limite d&#x27;entraînement du modèle et compare l&#x27;API publique de façon statique avec griffe. Sonde : de courtes tâches qui nécessitent une API modifiée, le modèle répond sans outils ni documentation, et basedpyright vérifie la réponse avec les deux versions. Rédaction et test des notes : une note rédigée par le modèle n&#x27;est conservée que si son exemple passe la vérification de types ; sinon, un constat du changement tiré du diff d&#x27;API la remplace. Le modèle répond ensuite aux tâches réservées sans puis avec les notes, et --apply écrit le bloc dans AGENTS.md.</desc>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #bc4c00; }
    .red { fill: #cf222e; }
    .green { fill: #1a7f37; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
  </style>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="507" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect x="16" y="16" width="608" height="134" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="49" font-size="22" class="sans b accent">1  Analyse</text>
<text x="604" y="48" font-size="17" class="sans muted" text-anchor="end">aucun appel au modèle</text>
<line x1="46" y1="74" x2="46" y2="132" stroke="#d0d7de" stroke-width="2"/>
<circle cx="46" cy="74" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="80" font-size="20" class="sans text">Verrouillage : vos versions exactes</text>
<circle cx="46" cy="103" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="109" font-size="20" class="sans text">La version à la date limite du modèle</text>
<circle cx="46" cy="132" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="138" font-size="20" class="sans text">Diff statique de l&#x27;API avec griffe</text>
<line x1="46" y1="153" x2="46" y2="172" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<rect x="16" y="176" width="608" height="134" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="209" font-size="22" class="sans b accent">2  Sonde</text>
<text x="604" y="208" font-size="17" class="sans muted" text-anchor="end">le modèle, sans outils</text>
<line x1="46" y1="234" x2="46" y2="292" stroke="#d0d7de" stroke-width="2"/>
<circle cx="46" cy="234" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="240" font-size="20" class="sans text">Des tâches qui exigent le changement</text>
<circle cx="46" cy="263" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="269" font-size="20" class="sans text">Le modèle répond de mémoire</text>
<circle cx="46" cy="292" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="298" font-size="20" class="sans text">basedpyright vérifie les deux versions</text>
<line x1="46" y1="313" x2="46" y2="332" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<rect x="16" y="336" width="608" height="156" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="369" font-size="22" class="sans b accent">3  Rédaction et test des notes</text>
<text x="36" y="393" font-size="17" class="sans muted">le vérificateur de types tranche</text>
<line x1="46" y1="416" x2="46" y2="474" stroke="#d0d7de" stroke-width="2"/>
<circle cx="46" cy="416" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="422" font-size="20" class="sans text">Notes : typage vérifié, ou tirées du diff</text>
<circle cx="46" cy="445" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="451" font-size="20" class="sans text">Tâches réservées : sans puis avec les notes</text>
<circle cx="46" cy="474" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="480" font-size="20" class="sans text">--apply écrit un bloc dans AGENTS.md</text>
</svg>
