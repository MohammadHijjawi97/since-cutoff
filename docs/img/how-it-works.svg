<svg xmlns="http://www.w3.org/2000/svg" width="640" height="508" viewBox="0 0 640 508" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">How since-cutoff works</title>
<desc id="desc">Scan, with no model calls: read the lockfile, find each dependency&#x27;s release at the model&#x27;s training cutoff, and diff the public API statically with griffe. Probe: write short tasks that need a changed API, let the model answer with no tools and no docs, and type-check the answer with basedpyright against both versions. Write and test notes: keep a model-written note only if its example type-checks, otherwise state the change from the API diff; then compare held-out tasks without and with the notes, and write the block into AGENTS.md with --apply.</desc>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #bc4c00; }
    .red { fill: #cf222e; }
    .green { fill: #1a7f37; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
  </style>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="507" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect x="16" y="16" width="608" height="134" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="49" font-size="22" class="sans b accent">1  Scan</text>
<text x="604" y="48" font-size="17" class="sans muted" text-anchor="end">no model calls</text>
<line x1="46" y1="74" x2="46" y2="132" stroke="#d0d7de" stroke-width="2"/>
<circle cx="46" cy="74" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="80" font-size="20" class="sans text">Lockfile: your exact versions</text>
<circle cx="46" cy="103" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="109" font-size="20" class="sans text">The release at the model&#x27;s cutoff</text>
<circle cx="46" cy="132" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="138" font-size="20" class="sans text">Static API diff with griffe</text>
<line x1="46" y1="153" x2="46" y2="172" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<rect x="16" y="176" width="608" height="134" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="209" font-size="22" class="sans b accent">2  Probe</text>
<text x="604" y="208" font-size="17" class="sans muted" text-anchor="end">the model, no tools</text>
<line x1="46" y1="234" x2="46" y2="292" stroke="#d0d7de" stroke-width="2"/>
<circle cx="46" cy="234" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="240" font-size="20" class="sans text">Short tasks that need the change</text>
<circle cx="46" cy="263" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="269" font-size="20" class="sans text">The model answers from memory</text>
<circle cx="46" cy="292" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="298" font-size="20" class="sans text">basedpyright checks both versions</text>
<line x1="46" y1="313" x2="46" y2="332" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<rect x="16" y="336" width="608" height="156" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="369" font-size="22" class="sans b accent">3  Write and test notes</text>
<text x="36" y="393" font-size="17" class="sans muted">the type checker decides</text>
<line x1="46" y1="416" x2="46" y2="474" stroke="#d0d7de" stroke-width="2"/>
<circle cx="46" cy="416" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="422" font-size="20" class="sans text">Notes: type-checked, or from the diff</text>
<circle cx="46" cy="445" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="451" font-size="20" class="sans text">Held-out tasks: without vs. with notes</text>
<circle cx="46" cy="474" r="5" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
<text x="64" y="480" font-size="20" class="sans text">--apply writes a block to AGENTS.md</text>
</svg>
