<svg xmlns="http://www.w3.org/2000/svg" width="640" height="474" viewBox="0 0 640 474" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">since-cutoff: your coding model learned your libraries before they changed</title>
<desc id="desc">Claude Opus 4.6, tested on one sample project with since-cutoff 0.1.0: on 7 of 16 probed API changes it used a name or parameter that has since been removed. With the notes, 5% -&gt; 65% of 20 held-out tasks were correct. Try it: uvx since-cutoff scan (no model calls, no API key).</desc>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #f0f6fc; }
    .muted { fill: #9198a1; }
    .accent { fill: #f0883e; }
    .red { fill: #ff7b72; }
    .green { fill: #56d364; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
  </style>
<clipPath id="card"><rect x="0.5" y="0.5" width="639" height="473" rx="16"/></clipPath>
<rect x="0.5" y="0.5" width="639" height="473" rx="16" fill="#0d1117" stroke="#3d444d"/>
<rect x="0" y="0" width="640" height="6" fill="#f0883e" clip-path="url(#card)"/>
<g transform="translate(25 29) scale(0.0546875)"><circle cx="256" cy="256" r="148" fill="none" stroke="#f0883e" stroke-width="44"/><path d="M256 168v88l62 38" fill="none" stroke="#f0f6fc" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="60" y="50" font-size="20" class="mono b accent">since-cutoff</text>
<text x="28" y="96" font-size="30" class="sans b text">Your coding model learned your</text>
<text x="28" y="134" font-size="30" class="sans b text">libraries before they changed.</text>
<text x="28" y="172" font-size="18" class="sans muted">Claude Opus 4.6 on one sample project (since-cutoff 0.1.0):</text>
<rect x="28" y="190" width="584" height="95" rx="10" fill="#151b23" stroke="#3d444d"/>
<text x="48" y="252.5" font-size="42" class="sans b"><tspan class="red">7</tspan><tspan class="text"> of 16</tspan></text>
<text x="300" y="219.15" font-size="19" class="sans text">probed API changes where it</text>
<text x="300" y="244.15" font-size="19" class="sans text">used a name or parameter</text>
<text x="300" y="269.15" font-size="19" class="sans text">that has since been removed</text>
<rect x="28" y="297" width="584" height="95" rx="10" fill="#151b23" stroke="#3d444d"/>
<text x="48" y="359.5" font-size="42" class="sans b"><tspan class="red">5%</tspan><tspan class="muted" font-weight="400"> → </tspan><tspan class="green">65%</tspan></text>
<text x="300" y="338.65" font-size="19" class="sans text">of 20 held-out tasks correct,</text>
<text x="300" y="363.65" font-size="19" class="sans text">without → with the notes</text>
<rect x="28" y="406" width="584" height="44" rx="8" fill="#010409" stroke="#3d444d"/>
<text x="46" y="435" font-size="21" class="mono"><tspan class="muted">$ </tspan><tspan class="text b">uvx since-cutoff scan</tspan></text>
<text x="596" y="434" font-size="16" class="sans muted" text-anchor="end">no model calls, no API key</text>
</svg>
