# Link previews (jekyll-seo-tag, which the cayman theme includes). With an image, the card is
# summary_large_image by default. No `twitter:` block: without a username it would print
# twitter:site "@" and a twitter:creator made from the author name.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: https://mohammadhijjawi97.github.io/since-cutoff/img/og.png
        width: 1200
        height: 630
        alt: "since-cutoff: find which of your dependency APIs changed after your coding model's training cutoff, and write short AGENTS.md notes from the API diff, each with its source"
